<h2 mat-dialog-title>{{ isEditMode ? 'Transaktion bearbeiten' : 'Neue Transaktion' }}</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Betrag (€)</mat-label>
      <input matInput type="number" step="0.01" formControlName="amount">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Datum</mat-label>
      <input matInput type="date" formControlName="date">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Typ</mat-label>
      <mat-select formControlName="type">
        <mat-option [value]="TransactionType.Income">Einnahme</mat-option>
        <mat-option [value]="TransactionType.Expense">Ausgabe</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Kategorie</mat-label>
      <mat-select formControlName="categoryId">
        @for (category of categories(); track category.id) {
        <mat-option [value]="category.id">{{ category.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Beschreibung (optional)</mat-label>
      <input matInput formControlName="description" placeholder="z. B. Mittag im Café">
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Abbrechen</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">Speichern</button>
</div>
