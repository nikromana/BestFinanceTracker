<h2 mat-dialog-title>{{ isEditMode ? 'Budget bearbeiten' : 'Neues Budget' }}</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Kategorie</mat-label>
      <mat-select formControlName="categoryId">
        @for (category of expenseCategories(); track category.id) {
        <mat-option [value]="category.id">{{ category.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Jahr</mat-label>
        <mat-select formControlName="year">
          @for (year of years; track year) {
          <mat-option [value]="year">{{ year }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Monat</mat-label>
        <mat-select formControlName="month">
          @for (month of months; track month) {
          <mat-option [value]="month">{{ month }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Budget-Limit (€)</mat-label>
      <input matInput type="number" step="0.01" formControlName="limit">
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Abbrechen</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">Speichern</button>
</div>
